[[sections]]
title = "Experience"
title_zh = "就业经历"
icon = "pen-tool"
markdown = '''
##### <img src="/static/safari-pinned-tab.svg" alt="UIC" width="24" height="auto"> University of Illinois at Chicago - United States

- Graduate Research Assistant, advised by Prof. [Daniela Tuninetti](https://nicest.lab.uic.edu/profiles/tuninetti-daniela/), 05/2020 - 12/2025
    - Coded Caching is a broadcast network which leverages locally cached contents at users side by transmitting coded messages, so it can boost the network performance comparing to uncoded scenario.
    - Researching and exploring the information limits on coded caching, including numerical analysis by formulating a large linear programming model on Gurobi.
    - Co-advised students with advisor for their summer research internship at our lab.
- Graduate Research Assistant, advised by Prof. [Shuo Han](https://han-uic.github.io/), 01/2020 - 05/2020
    - Distributed optimization and consensus optimization, [[slides]](https://github.com/dlmyb/OptCat/blob/master/doc/presentation.pdf).
    - Researched and implemented algorithms on high performance clusters platform at UIC, including ADMM, variation reduction, asynchronous gradient method.
'''
markdown_zh = '''
##### <img src="/static/safari-pinned-tab.svg" alt="UIC" width="24" height="auto"> University of Illinois at Chicago - 美国

- 研究助理（博士全奖）, 由 [Daniela Tuninetti](https://nicest.lab.uic.edu/profiles/tuninetti-daniela/) 教授指导, 05/2020 - 12/2025
    - Coded Caching 是一种广播网络模型，它利用用户侧本地缓存的内容，通过传输编码消息来提升相较于非编码方案的网络性能。
    - 研究 Coded Caching 的信息论极限，包括在 Gurobi 中构建大规模线性规划模型进行数值分析。
    - 与导师共同指导学生完成实验室暑期科研实习项目。
- 研究助理（见习）, 由 [Shuo Han](https://han-uic.github.io/) 教授指导, 01/2020 - 05/2020
    - 分布式优化与一致性优化，[[链接]](https://github.com/dlmyb/OptCat/blob/master/doc/presentation.pdf)。
    - 在 UIC 高性能集群上运行对应的优化算法，包括 ADMM, variation reduction, asynchronous gradient method。
'''

