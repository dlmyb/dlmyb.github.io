[[sections]]
title = "Short Bio"
title_zh = "简介"
icon = "user"
markdown = '''
Yinbin Ma is a Ph.D. candidate in the Department of Electrical and Computer Engineering (ECE) at the University of Illinois at Chicago (UIC). He is advised by Professor [Daniela Tuninetti](https://nicest.lab.uic.edu/profiles/tuninetti-daniela/). Prior to starting his Ph.D. program, Yinbin earned an M.S. in ECE at UIC and a B.S. in Computer Science at Xidian University. Yinbin's research interests lie in the field of information theory, particularly shared-link caching network models. His Ph.D. dissertation is *Optimizing Placement and Delivery for Coded Caching*.

**For PhD Thesis**: I have submitted my PhD thesis to UIC library. However, I can't make it public soon as some sections are still under review for publication. If you are interested in my research, feel free to contact me and I may send you the draft.

UIC has **suspended** my UIC email service (yma52 AT uic.edu). Please contact me through the listed email address. Thanks.
'''
markdown_zh = '''
我正在 ECE UIC 攻读博士学位，由 [Daniela Tuninetti](https://nicest.lab.uic.edu/profiles/tuninetti-daniela/) 教授指导。之前，我曾就读于西安电子科技大学。我拥有 ECE UIC 的硕士学位以及西安电子科技大学的计算机科学与技术学士学位。我目前研究领域为信息论，研究兴趣包括 Shared-link caching network，我的博士研究名称为 *Optimizing Placement and Delivery for Coded Caching*。

**关于博士论文**：我已经将博士论文提交给 UIC 图书馆。不过，由于其中一些章节仍在投稿审稿中，我暂时不能很快公开全文。如果你对我的研究感兴趣，欢迎联系我，我可以把草稿发给你。

UIC 已经**停用**了我的 UIC 邮箱服务（yma52 AT uic.edu）。请通过本页列出的邮箱地址联系我，谢谢。
'''

